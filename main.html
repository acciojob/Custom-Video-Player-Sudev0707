<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Custom Video Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="player">
  <video class="player__video viewer" src="download.mp4" preload="metadata"></video>

  <div class="player__controls">
    <div class="progress">
      <div class="progress__filled"></div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 8px; flex-wrap: wrap;">
      <button class="player__button toggle" title="Play / Pause">►</button>

      <div class="controls-group">
        <span class="slider-label">🔊</span>
        <input type="range" name="volume" class="player__slider" min="0" max="1" step="0.02" value="1">
      </div>

      <div class="controls-group">
        <span class="slider-label">⚡</span>
        <input type="range" name="playbackRate" class="player__slider" min="0.5" max="2" step="0.05" value="1">
      </div>

      <div class="skip-group">
        <button data-skip="-10" class="player__button" title="Rewind 10 seconds">« 10s</button>
        <button data-skip="25" class="player__button" title="Forward 25 seconds">25s »</button>
      </div>
    </div>
  </div>
</div>

<script src="scripts.js"></script>
</body>
</html>
